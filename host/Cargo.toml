[package]
name = "openbots-host"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
hive-contract = { path = "../crates/hive-contract" }
hive-policy = { path = "../crates/hive-policy" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "=1.11.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
hive-runner = { path = "../runner" }
