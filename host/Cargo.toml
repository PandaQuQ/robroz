[package]
name = "robroz-host"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
robroz-contract = { path = "../crates/robroz-contract" }
robroz-policy = { path = "../crates/robroz-policy" }
robroz-card = { path = "../crates/robroz-card" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "=1.11.0", features = ["v4"] }
croner = "4.0.1"
robroz-runner = { path = "../runner" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
