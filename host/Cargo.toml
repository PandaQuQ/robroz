[package]
name = "robroz-host"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
robroz-contract = { path = "../crates/robroz-contract" }
robroz-policy = { path = "../crates/robroz-policy" }
robroz-card = { path = "../crates/robroz-card" }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "=1.11.0", features = ["v4"] }
croner = "4.0.1"
futures-util = { version = "0.3", default-features = false }
robroz-runner = { path = "../runner" }
robroz-model = { path = "../crates/robroz-model" }
robroz-mcp = { path = "../crates/robroz-mcp" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
robroz-mcp = { path = "../crates/robroz-mcp", features = ["fixture"] }
