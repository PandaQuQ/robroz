[package]
name = "robroz-client"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

[dependencies]
robroz-contract = { path = "../crates/robroz-contract" }
robroz-card = { path = "../crates/robroz-card" }
robroz-ui = { path = "../crates/robroz-ui" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iced = { version = "0.14.0", features = ["tokio", "canvas"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
# rustls (same as the host) so a remote ROBROZ_HOST can be https://; no system TLS deps.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Decodes the embedded PNG for the window icon (iced is built without its `image` feature).
png = "0.18"
# OS keychain for the saved host token; falls back to a 0600 file if unavailable.
# Native backends only (no OpenSSL, no libdbus). linux-native is the kernel keyring.
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }

[dev-dependencies]
robroz-host = { path = "../host" }
axum = "0.8"
serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }

[build-dependencies]
# Embeds assets/brand/icon.ico into the Windows exe. build.rs only calls it when
# targeting Windows; the crate itself compiles on every host.
winresource = "0.1"
