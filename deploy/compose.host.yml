# Example only. Read docs/docker-host.md first: mounting docker.sock gives the
# host container root-equivalent control of this machine's Docker engine.
#
# Before the first start:
#   sudo install -d -o 1000 -g 1000 /srv/robroz
#   mkdir -p secrets && (umask 077 && openssl rand -hex 24 > secrets/robroz_token)
#   export DOCKER_GID="$(getent group docker | cut -d: -f3)"
#   docker pull ghcr.io/pandaquq/robroz-runner:v0.2.0
#   docker compose -f compose.host.yml up -d
#
# Do not put a token or a model key in this file or in the repository.
secrets:
  robroz_token:
    file: ./secrets/robroz_token

services:
  host:
    image: ghcr.io/pandaquq/robroz-host:v0.2.0
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the docker group id}"
    environment:
      ROBROZ_ADDR: "0.0.0.0:8790"
      # Same absolute path as the volume below, on both sides.
      ROBROZ_DB: /srv/robroz/robroz.db
      ROBROZ_VOLUMES: /srv/robroz/groups
      ROBROZ_CONTROL: /srv/robroz/control
      ROBROZ_IMAGE: ghcr.io/pandaquq/robroz-runner:v0.2.0
      ROBROZ_TOKEN_FILE: /run/secrets/robroz_token
      # Owner of the files the runners write under /srv/robroz/groups.
      ROBROZ_CONTAINER_USER: "1000:1000"
    volumes:
      - /srv/robroz:/srv/robroz
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8790:8790"
    secrets:
      - robroz_token
    restart: unless-stopped
