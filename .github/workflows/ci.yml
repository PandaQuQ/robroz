name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test host and shared crates
        run: cargo test -p robroz-host -p hive-contract -p hive-policy -p hive-card -p hive-runner

  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build client
        run: cargo build -p robroz-client
      - name: Test client
        run: cargo test -p robroz-client
