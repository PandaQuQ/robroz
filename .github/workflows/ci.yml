name: CI

# Save Actions minutes: PRs run Linux only; macOS and Windows run after
# merging to main and once a day. Pushes to PR branches don't double-run.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test host and shared crates
        run: cargo test -p robroz-host -p robroz-contract -p robroz-policy -p robroz-card -p robroz-runner -p robroz-tokens

  client:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build client
        run: cargo build -p robroz-client
      - name: Test client, UI kit and tokens
        run: cargo test -p robroz-client -p robroz-ui -p robroz-tokens

  e2e:
    # Node 7: real host binary + real docker, runner image as the fake model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: End-to-end (task, sandbox, approval, restart, resume, no replay)
        run: scripts/e2e.sh
