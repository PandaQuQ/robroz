name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test host and shared crates
        run: cargo test -p robroz-host -p robroz-contract -p robroz-policy -p robroz-card -p robroz-runner -p robroz-tokens

  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build client
        run: cargo build -p robroz-client
      - name: Test client, UI kit and tokens
        run: cargo test -p robroz-client -p robroz-ui -p robroz-tokens

  e2e:
    # Node 7: real host binary + real docker, runner image as the fake model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: End-to-end (task, sandbox, approval, restart, resume, no replay)
        run: scripts/e2e.sh
