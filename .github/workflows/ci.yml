name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Test
        run: |
          if [ ! -f go.mod ]; then
            echo "no go.mod yet, skip"
            exit 0
          fi
          go test ./...

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build
        run: |
          if [ ! -f client/package.json ]; then
            echo "no client yet, skip"
            exit 0
          fi
          cd client
          npm ci
          npm run build
