name: CLA

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  cla:
    name: cla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { claCheckboxTicked, shouldSkipClaCheck } = require('./.github/scripts/cla-checkbox.js');
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('CLA check expected a pull_request payload.');
              return;
            }
            if (shouldSkipClaCheck(pr.user)) {
              core.info(`Skipping CLA check for bot ${pr.user.login}.`);
              return;
            }
            if (!claCheckboxTicked(pr.body || '')) {
              core.setFailed(
                'Please tick the Contributor License Agreement checkbox in the pull request description. See https://github.com/PandaQuQ/robroz/blob/main/CLA.md',
              );
            }
