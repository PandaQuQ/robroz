name: Release

# Builds release binaries when a `v*` tag is pushed and attaches them, with
# SHA256 checksums, to a draft GitHub Release. The draft stays private until
# a maintainer publishes it by hand. Binaries are not code-signed.
#
# workflow_dispatch is a dry run: it builds and packages the same artifacts,
# and builds the runner image without pushing it. It does not create a release.
#
# A separate job builds two images (linux/amd64, context is the repository
# root) and pushes them with the version tag only:
#   runner/Dockerfile -> ghcr.io/pandaquq/robroz-runner:<tag>
#   host/Dockerfile   -> ghcr.io/pandaquq/robroz-host:<tag>
# The draft release does not wait for that job, so host and client assets
# still upload if an image push fails. There is no `latest` tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned so the Linux binaries link against glibc 2.35 and run on
          # Ubuntu 22.04+ and Debian 12+. ubuntu-latest moves forward.
          - os: ubuntu-22.04
            target: linux-x86_64
            packages: "-p robroz-client -p robroz-host"
            bins: "robroz-client robroz-host"
          - os: windows-latest
            target: windows-x86_64
            packages: "-p robroz-client"
            bins: "robroz-client"
          - os: macos-latest
            target: macos-aarch64
            packages: "-p robroz-client"
            bins: "robroz-client"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: cargo build --release --locked ${{ matrix.packages }}
      - name: Check glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for bin in ${{ matrix.bins }}; do
            max=$(objdump -T "target/release/${bin}" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "${bin} needs glibc ${max}"
            if [ "$(printf '%s\n2.35\n' "${max}" | sort -V | tail -1)" != "2.35" ]; then
              echo "::error::${bin} needs glibc ${max}, above the 2.35 floor"
              exit 1
            fi
          done
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          # A dispatched dry run may come from a branch whose name contains slashes.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${version//\//-}"
          fi
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p dist
          for bin in ${{ matrix.bins }}; do
            name="${bin}-${version}-${{ matrix.target }}"
            stage="stage/${name}"
            mkdir -p "${stage}"
            cp "target/release/${bin}${ext}" "${stage}/"
            cp LICENSE README.md "${stage}/"
            if [ "${{ runner.os }}" = "macOS" ] && [ "${bin}" = "robroz-client" ]; then
              # Wrap the client in a minimal .app bundle, including the
              # Dock and Finder icon.
              app="${stage}/robroz.app/Contents"
              mkdir -p "${app}/MacOS" "${app}/Resources"
              mv "${stage}/${bin}" "${app}/MacOS/${bin}"
              cp assets/brand/icon.icns "${app}/Resources/icon.icns"
              cat > "${app}/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>robroz</string>
            <key>CFBundleDisplayName</key><string>robroz</string>
            <key>CFBundleIdentifier</key><string>io.github.pandaquq.robroz</string>
            <key>CFBundleExecutable</key><string>${bin}</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version#v}</string>
            <key>CFBundleVersion</key><string>${version#v}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
            fi
            if [ "${{ runner.os }}" = "Linux" ] && [ "${bin}" = "robroz-client" ]; then
              cp client/packaging/robroz.desktop "${stage}/"
              cp assets/brand/icon-512.png "${stage}/robroz.png"
            fi
            if [ "${{ runner.os }}" = "Windows" ]; then
              (cd stage && 7z a -tzip "../dist/${name}.zip" "${name}" > /dev/null)
            elif [ "${{ runner.os }}" = "macOS" ]; then
              (cd stage && zip -qry "../dist/${name}.zip" "${name}")
            else
              tar -C stage -czf "dist/${name}.tar.gz" "${name}"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Write release notes
        run: |
          set -euo pipefail
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "${notes}" ]; then
            cp "${notes}" notes.md
          else
            TAG="${GITHUB_REF_NAME}" envsubst '${TAG}' < .github/release-notes/TEMPLATE.md > notes.md
          fi
          # Both halves must be there: English first, then the Chinese section.
          grep -q '^## 中文' notes.md
          cat notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pre=""
          case "${GITHUB_REF_NAME}" in v0.*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft ${pre} \
            --title "robroz ${GITHUB_REF_NAME}" \
            --notes-file notes.md

  image:
    name: image (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: robroz-runner
            file: runner/Dockerfile
            description: Task runner image for robroz host sandboxes
          - image: robroz-host
            file: host/Dockerfile
            description: robroz host with the Docker CLI, for running the host in a container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/${IMAGE}" >> "$GITHUB_OUTPUT"
          tag="$REF_NAME"
          # A dispatched dry run may come from a branch whose name contains slashes.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${tag//\//-}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          # Attestation needs id-token: write. Keep this job's permissions to
          # contents: read and packages: write only.
          provenance: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/PandaQuQ/robroz
            org.opencontainers.image.url=https://github.com/PandaQuQ/robroz
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
