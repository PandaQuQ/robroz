name: Release

# Builds the host release binary when a `v*` tag is pushed and attaches it,
# with SHA256 checksums, to a draft GitHub Release. The draft stays private until
# a maintainer publishes it by hand. Binaries are not code-signed.
#
# workflow_dispatch is a dry run: it builds and packages the same artifacts,
# and builds the runner image without pushing it. It does not create a release.
#
# A separate job builds two images (linux/amd64, context is the repository
# root) and pushes them with the version tag only:
#   runner/Dockerfile -> ghcr.io/pandaquq/robroz-runner:<tag>
#   host/Dockerfile   -> ghcr.io/pandaquq/robroz-host:<tag>
# The draft release does not wait for that job, so the host assets still
# upload if an image push fails. There is no `latest` tag.
#
# Client binaries are released from https://github.com/PandaQuQ/robroz-client.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_host_image:
        description: "Push only the robroz-host image as main-<short sha> (main only, no release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.push_host_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned so the Linux binaries link against glibc 2.35 and run on
          # Ubuntu 22.04+ and Debian 12+. ubuntu-latest moves forward.
          - os: ubuntu-22.04
            target: linux-x86_64
            packages: "-p robroz-host"
            bins: "robroz-host"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: cargo build --release --locked ${{ matrix.packages }}
      # `[profile.release] strip = true` in the workspace Cargo.toml.
      - name: Check binaries are stripped
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for bin in ${{ matrix.bins }}; do
            info=$(file "target/release/${bin}")
            echo "${info}"
            case "${info}" in
              *"not stripped"*) echo "::error::${bin} is not stripped"; exit 1 ;;
              *stripped*) ;;
              *) echo "::error::cannot tell whether ${bin} is stripped"; exit 1 ;;
            esac
            "target/release/${bin}" --version
          done
      - name: Check glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for bin in ${{ matrix.bins }}; do
            max=$(objdump -T "target/release/${bin}" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "${bin} needs glibc ${max}"
            if [ "$(printf '%s\n2.35\n' "${max}" | sort -V | tail -1)" != "2.35" ]; then
              echo "::error::${bin} needs glibc ${max}, above the 2.35 floor"
              exit 1
            fi
          done
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          # A dispatched dry run may come from a branch whose name contains slashes.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${version//\//-}"
          fi
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p dist
          for bin in ${{ matrix.bins }}; do
            name="${bin}-${version}-${{ matrix.target }}"
            stage="stage/${name}"
            mkdir -p "${stage}"
            cp "target/release/${bin}${ext}" "${stage}/"
            cp LICENSE README.md "${stage}/"
            if [ "${{ runner.os }}" = "Windows" ]; then
              (cd stage && 7z a -tzip "../dist/${name}.zip" "${name}" > /dev/null)
            elif [ "${{ runner.os }}" = "macOS" ]; then
              (cd stage && zip -qry "../dist/${name}.zip" "${name}")
            else
              tar -C stage -czf "dist/${name}.tar.gz" "${name}"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Write release notes
        run: |
          set -euo pipefail
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "${notes}" ]; then
            cp "${notes}" notes.md
          else
            TAG="${GITHUB_REF_NAME}" envsubst '${TAG}' < .github/release-notes/TEMPLATE.md > notes.md
          fi
          # Both halves must be there: English first, then the Chinese section.
          grep -q '^## 中文' notes.md
          cat notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pre=""
          case "${GITHUB_REF_NAME}" in v0.*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft ${pre} \
            --title "robroz ${GITHUB_REF_NAME}" \
            --notes-file notes.md

  image:
    name: image (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: robroz-runner
            file: runner/Dockerfile
            description: Task runner image for robroz host sandboxes
          - image: robroz-host
            file: host/Dockerfile
            description: robroz host with the Docker CLI, for running the host in a container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Tag pushes push both images. A dispatch from main with push_host_image
      # pushes only robroz-host. Every other dispatch is a dry run.
      PUSH: ${{ github.event_name == 'push' || (inputs.push_host_image && github.ref == 'refs/heads/main' && matrix.image == 'robroz-host') }}
      SKIP: ${{ inputs.push_host_image && matrix.image != 'robroz-host' }}
    steps:
      - uses: actions/checkout@v4
        if: env.SKIP != 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.SKIP != 'true'
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        if: env.SKIP != 'true'
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/${IMAGE}" >> "$GITHUB_OUTPUT"
          tag="$REF_NAME"
          # A dispatched dry run may come from a branch whose name contains slashes.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${tag//\//-}"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PUSH" = "true" ]; then
            tag="main-${GITHUB_SHA::7}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: env.SKIP != 'true'
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ env.PUSH == 'true' }}
          platforms: linux/amd64
          # Attestation needs id-token: write. Keep this job's permissions to
          # contents: read and packages: write only.
          provenance: false
          build-args: |
            ROBROZ_GIT_SHA=${{ github.sha }}
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/PandaQuQ/robroz
            org.opencontainers.image.url=https://github.com/PandaQuQ/robroz
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
