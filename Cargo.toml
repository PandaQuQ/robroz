[workspace]
members = [
    "host",
    "client",
    "crates/robroz-contract",
    "crates/robroz-policy",
    "crates/robroz-card",
    "crates/robroz-tokens",
    "crates/robroz-ui",
    "crates/robroz-model",
    "crates/robroz-mcp",
    "runner",
    "mobile",
]
# `mobile/` (Slint, Android/iOS spike) is built by its own workflow, not by a bare `cargo build`.
default-members = [
    "host",
    "client",
    "crates/robroz-contract",
    "crates/robroz-policy",
    "crates/robroz-card",
    "crates/robroz-tokens",
    "crates/robroz-ui",
    "crates/robroz-model",
    "crates/robroz-mcp",
    "runner",
]
resolver = "2"

[workspace.package]
license = "AGPL-3.0-only"
