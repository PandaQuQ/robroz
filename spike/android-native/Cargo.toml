# Android spike (not part of the main workspace). Compiles the CURRENT
# client source unchanged as a cdylib: build.sh copies client/src into src/
# (main.rs -> lib.rs) and appends android.rs. iced comes from the
# iced_android fork (branch android-0.14), patched for every crate,
# including robroz-ui.
[workspace]

[package]
name = "robroz-android"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "robroz_android"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
robroz-contract = { path = "../../crates/robroz-contract" }
robroz-card = { path = "../../crates/robroz-card" }
robroz-ui = { path = "../../crates/robroz-ui" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "tokio", "canvas", "x11"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
ureq = { version = "3", default-features = false }
iced_android = { git = "https://github.com/Santuzius/iced_android", tag = "v0.1.2" }
android_logger = "0.15"
log = "0.4"

[patch.crates-io]
iced = { git = "https://github.com/Santuzius/iced", tag = "iced_android-v0.1.2" }
android-activity = { git = "https://github.com/Santuzius/android-activity", tag = "iced_android-v0.1.2" }

[profile.release]
strip = true
lto = "thin"
